name: Release to GitHub and npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate release version
        id: release
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(pkg.name, 'omo-herdr-dag');
          assert.equal(lock.version, pkg.version, 'Lockfile version must match');
          assert.equal(lock.packages[''].version, pkg.version, 'Lockfile package version must match');
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/);
          if (process.env.GITHUB_EVENT_NAME === 'push') {
            assert.equal(process.env.GITHUB_REF, `refs/tags/v${pkg.version}`, 'Tag must match package version');
          } else {
            assert.equal(process.env.GITHUB_EVENT_NAME, 'workflow_dispatch');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${pkg.version.includes('-') ? 'next' : 'latest'}\n`);
          NODE

  verify:
    needs: prepare
    uses: ./.github/workflows/test.yml

  github-release:
    needs: [prepare, verify]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package-node-24
          path: .artifacts
      - name: Create GitHub release with verified package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NPM_DIST_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release already exists: $GITHUB_REF_NAME"
            exit 0
          fi
          args=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [ "$NPM_DIST_TAG" = next ]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" .artifacts/*.tgz "${args[@]}"

  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-package-node-24
          path: .artifacts
      - name: Validate package contents without publishing
        run: npm publish .artifacts/*.tgz --dry-run --ignore-scripts --access public --tag '${{ needs.prepare.outputs.tag }}'
      - name: Publish verified package
        if: github.event_name == 'push'
        run: npm publish .artifacts/*.tgz --ignore-scripts --access public --provenance --tag '${{ needs.prepare.outputs.tag }}'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
